<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrace | Ing. arch. Naďa Francová. Ph.D.</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <div class="inner-content">
            <header class="top-header">
                <a href="index.html">← Zpět na web</a>
            </header>

            <div class="page-text" style="max-width: 100%;">
                <div id="login-screen" style="max-width: 400px; margin: 0 auto; text-align: center; display: none;">
                    <h2>Přihlášení do administrace</h2>
                    <br>
                    <input type="text" id="admin-user" placeholder="Přihlašovací jméno" style="width: 100%; padding: 10px; margin-bottom: 10px;">
                    <input type="password" id="admin-pass" placeholder="Heslo" style="width: 100%; padding: 10px; margin-bottom: 20px;">
                    <button onclick="login()" style="padding: 10px 20px; background: #33322e; color: white; border: none; cursor: pointer; width: 100%;">Přihlásit</button>
                </div>

                <div id="admin-dashboard" style="display: none;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                        <h1 style="font-size: 2rem; margin: 0;">Správa blogu</h1>
                        <button onclick="logout()" style="padding: 8px 15px; background: transparent; border: 1px solid #33322e; cursor: pointer;">Odhlásit se</button>
                    </div>
                    
                    <div style="max-width: 800px;">
                        <h3 style="margin-top: 0;">Přidat / Upravit článek</h3>
                        <form id="add-blog-form" class="admin-form" onsubmit="addNewBlog(event)">
                            <input type="text" id="new-title" placeholder="Název článku" required>
                            
                            <!-- Povinné datum zrušeno kvůli plynulejší editaci -->
                            <input type="date" id="new-date">
                            
                            <div style="background: #e6e4dc; padding: 10px; margin-bottom: 20px; border-radius: 4px;">
                                <label style="display: block; font-size: 0.85rem; color: #5a5753; margin-bottom: 5px;">Náhledová fotka pro mřížku (bude nahrána na Google Disk)</label>
                                <input type="file" id="new-image-file" accept="image/png, image/jpeg, image/webp" style="margin-bottom: 0;">
                            </div>
                            
                            <textarea id="new-excerpt" rows="3" placeholder="Krátký popis (náhled do menu)" required></textarea>
                            
                            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: -10px;">
                                <button type="button" onclick="insertImageToContent()" style="background: #8b7d6b; color: white; padding: 0.6rem 1rem; font-size: 0.8rem; border-radius: 4px; text-transform: none; font-weight: normal; letter-spacing: normal; width: auto;">+ Vložit fotku do textu</button>
                                <small style="color: #5a5753;">Klikni, pokud chceš přidat obrázek kamkoliv mezi odstavce.</small>
                            </div>
                            
                            <textarea id="new-content" rows="10" placeholder="Celý text článku (HTML tagy povoleny)..." required></textarea>
                            <button type="submit" style="width: auto;">Publikovat článek</button>
                        </form>

                        <h3 style="margin-top: 4rem;">Existující články</h3>
                        <ul id="admin-post-list" class="admin-post-list"></ul>
                    </div>

                    <!-- NÁHLED PROJECT TRACKERU PŘÍMO V ADMINU -->
                    <div style="margin-top: 5rem;">
                        <h2 style="border-bottom: 2px solid var(--text-main); padding-bottom: 10px;">Náhled Project Trackeru</h2>
                        <iframe src="https://project-tracker-esni.onrender.com" width="100%" height="700px" style="border: 1px solid var(--line-color); border-radius: 8px; margin-top: 1rem; background: white;"></iframe>
                    </div>

                </div>
            </div>
        </div>
        <br><br>
        <footer>
            Systém pro správu obsahu
        </footer>
    </main>
</body>
</html>
