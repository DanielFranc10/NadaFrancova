<!DOCTYPE html>
<html lang="cs">
<head>
    <script src="udrzba.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrace | Ing. arch. Naďa Francová. Ph.D.</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <div class="inner-content">
            <header class="top-header"><a href="index.html">← Zpět na web</a></header>
            <div class="page-text">
                <div id="login-screen" class="login-box">
                    <h2>Přihlášení do administrace</h2><br>
                    <input type="text" id="admin-user" placeholder="Přihlašovací jméno">
                    <input type="password" id="admin-pass" placeholder="Heslo">
                    <button onclick="login()">Přihlásit</button>
                </div>

                <div id="admin-dashboard" style="display: none;">
                    <div class="admin-header">
                        <h1>Centrální systém</h1>
                        <button onclick="logout()">Odhlásit se</button>
                    </div>

                    <div class="admin-tabs">
                        <button class="tab-btn active-tab" onclick="switchTab('blog')">Správa Blogu</button>
                        <button class="tab-btn" onclick="switchTab('tracker')">Project Tracker</button>
                    </div>

                    <div id="tab-blog" class="tab-content" style="display: block;">
                        <h3>Napsat nový článek</h3>
                        <form id="add-blog-form" onsubmit="addNewBlog(event)">
                            <input type="text" id="new-title" placeholder="Název článku" required>
                            <input type="date" id="new-date" required>
                            <input type="text" id="new-excerpt" placeholder="Krátký perex" required>
                            <div class="editor-wrap"><div id="editor-container"></div></div>
                            <button type="submit" id="publish-btn">Publikovat článek</button>
                        </form>

                        <h3 style="margin-top: 4rem;">Existující články</h3>
                        <ul id="admin-post-list" class="admin-post-list"></ul>
                    </div>

                    <div id="tab-tracker" class="tab-content" style="display: none;">
                        <!-- VLOŽ ZDE URL Z VERCELU MÍSTO LOCALHOST -->
                        <iframe src="https://project-tracker-esni.onrender.com/" class="tracker-iframe"></iframe>
                    </div>
                </div>
            </div>
        </div>
        <footer>Systém pro správu obsahu</footer>
    </main>
</body>
</html>
