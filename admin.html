<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrace | Ing. arch. Naďa Francová. Ph.D.</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <div class="inner-content">
            <header class="top-header">
                <a href="index.html">← Zpět na web</a>
            </header>

            <div class="page-text">
                <!-- PŘIHLAŠOVACÍ OBRAZOVKA -->
                <div id="login-screen" style="max-width: 400px; margin: 0 auto; text-align: center; display: none;">
                    <h2>Přihlášení do administrace</h2>
                    <br>
                    <input type="text" id="admin-user" placeholder="Přihlašovací jméno" style="width: 100%; padding: 10px; margin-bottom: 10px;">
                    <input type="password" id="admin-pass" placeholder="Heslo" style="width: 100%; padding: 10px; margin-bottom: 20px;">
                    <button onclick="login()" style="padding: 10px 20px; background: #33322e; color: white; border: none; cursor: pointer; width: 100%;">Přihlásit</button>
                </div>

                <!-- ADMIN PANEL -->
                <div id="admin-dashboard" style="display: none;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                        <h1 style="font-size: 2rem; margin: 0;">Správa blogu</h1>
                        <button onclick="logout()" style="padding: 8px 15px; background: transparent; border: 1px solid #33322e; cursor: pointer;">Odhlásit se</button>
                    </div>
                    
                    <h3 style="margin-top: 0;">Přidat nový článek</h3>
                    <form id="add-blog-form" class="admin-form" onsubmit="addNewBlog(event)">
                        <input type="text" id="new-title" placeholder="Název článku" required>
                        <input type="date" id="new-date" required>
                        
                        <!-- Fotka pro mřížku na hlavní straně blogu -->
                        <input type="url" id="new-image" placeholder="URL adresa NÁHLEDOVÉ fotky pro mřížku (nepovinné)">
                        
                        <textarea id="new-excerpt" rows="3" placeholder="Krátký popis (náhled do menu)" required></textarea>
                        
                        <!-- NOVÉ TLAČÍTKO PRO FOTKY V TEXTU -->
                        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: -10px;">
                            <button type="button" onclick="insertImageToContent()" style="background: #8b7d6b; color: white; padding: 0.6rem 1rem; font-size: 0.8rem; border-radius: 4px; text-transform: none; font-weight: normal; letter-spacing: normal;">+ Vložit fotku do textu</button>
                            <small style="color: #5a5753;">Klikni, pokud chceš přidat obrázek kamkoliv mezi odstavce.</small>
                        </div>
                        
                        <textarea id="new-content" rows="10" placeholder="Celý text článku (HTML tagy povoleny)..." required></textarea>
                        <button type="submit">Publikovat článek</button>
                    </form>

                    <h3 style="margin-top: 4rem;">Existující články</h3>
                    
                    <ul id="admin-post-list" class="admin-post-list">
                        <!-- Zde se dynamicky načtou články z Javascriptu -->
                    </ul>
                </div>
            </div>
        </div>
        <br><br>
        <footer>
            Systém pro správu obsahu
        </footer>
    </main>

</body>
</html>
